version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shudong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/shudong?sslmode=disable
      ADDR: :8080
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
